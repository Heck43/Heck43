name: Update Profile Picture from ImgBB

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-profile-pic-simple.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Fetch random image and embed inside Stack SVGs
        run: python3 .profile/inject_stack_pic.py --fetch

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/daily-pic.png assets/stack-dark.svg assets/stack-light.svg
          git diff --staged --quiet || (git commit -m "🎨 Обновлена картинка в стеке" && git push)
