name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .profile/inject_stack_pic.py
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: metawka/expressive-profile@v1
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Install Pillow
        run: pip install pillow

      - name: Embed rounded daily photo inside Stack SVG & add footer
        run: |
          python3 .profile/inject_stack_pic.py
          python3 - <<'EOF'
          p = "README.md"
          s = open(p).read()
          footer = '\n<p align="center"><img src="https://heck43.github.io/media/boykisser-dance.gif" width="110" alt=":3" /></p>\n'
          if 'boykisser-dance.gif' not in s:
              s = s.replace('</div>', footer + '</div>')
          open(p, "w").write(s)
          EOF

      - name: Commit embedded stack photo & footer
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md assets/
          git diff --cached --quiet || (git commit -m "Embed daily photo into stack SVG & add footer" && git push)
